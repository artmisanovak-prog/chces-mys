<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Úhlový generátor · Fyzika linky</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg:#0f0d0a; --surface:#171410; --surface2:#1e1a14;
            --cream:#e8e0d0; --dim:rgba(232,224,208,.42); --accent:#a89880;
            --serif:'Cormorant Garamond',Georgia,serif; --mono:'DM Mono',monospace;
        }
        body {
            background:var(--bg); color:var(--cream); font-family:var(--mono);
            font-size:13px; padding:1rem; user-select:none;
            touch-action:manipulation;
        }
        .wrap { max-width:900px; margin:0 auto; }
        h1 { font-family:var(--serif); font-size:1.6rem; margin-bottom:0.3rem; font-weight:300; }
        h1 em { color:var(--accent); font-style:italic; }

        .panel {
            background:var(--surface); border:1px solid rgba(168,152,128,.15);
            padding:1.2rem; margin-bottom:1.5rem; border-radius:4px;
        }
        .panel-label {
            font-size:0.7rem; color:var(--dim); text-transform:uppercase; letter-spacing:.1em;
            margin-bottom:.8rem;
        }

        /* Karty s úhloměry */
        .cards-row {
            display:flex; flex-wrap:wrap; gap:1.5rem; justify-content:center; margin-bottom:1rem;
        }
        .card-unit {
            display:flex; flex-direction:column; align-items:center; gap:0.5rem;
        }
        .card-unit img {
            width:80px; aspect-ratio:74/105; object-fit:cover; border-radius:2px;
            filter:grayscale(100%) contrast(1.05); border:1px solid rgba(168,152,128,.2);
        }
        .card-unit img.landscape { aspect-ratio:105/74; width:100px; }
        .card-name {
            font-size:0.7rem; color:var(--dim); text-align:center;
        }
        .wheel-container {
            position:relative; width:200px; height:200px;
        }
        .wheel-container canvas {
            width:100%; height:100%; display:block; cursor:pointer; outline:none;
        }
        .selected-angle-label {
            font-size:0.65rem; color:var(--accent); text-align:center; min-height:1.2em;
        }

        /* Barevný proužek */
        .color-strip {
            display:flex; height:12px; border-radius:3px; overflow:hidden; margin:1rem 0;
        }
        .color-strip .segment {
            flex:1; min-width:8px;
        }

        /* Tlačítka */
        .btn {
            background:var(--accent); color:var(--bg); border:none;
            padding:0.6rem 1.3rem; font-family:var(--mono); font-size:0.7rem;
            letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
            transition:background .15s; border-radius:4px; margin:0.3rem;
        }
        .btn:hover { background:#c0aa90; }
        .btn-secondary {
            background:transparent; color:var(--accent);
            border:1px solid var(--accent);
        }
        .btn-secondary:hover { background:rgba(168,152,128,.1); }
        .btn-primary-action {
            background:#c0aa90; color:var(--bg); border:none;
            padding:0.6rem 1.3rem; font-family:var(--mono); font-size:0.7rem;
            letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
            transition:background .15s; border-radius:4px; margin:0.3rem;
        }
        .btn-primary-action:hover { background:#d4bfa5; }

        .btn-row { display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; justify-content:center; }

        /* Výstup */
        .result {
            background:var(--surface2); border:2px solid var(--accent);
            padding:1.5rem; display:none; border-radius:4px; margin-top:1rem;
            max-height:70vh; overflow-y:auto;
        }
        .result h2 { font-family:var(--serif); font-weight:300; color:var(--accent); margin-bottom:1rem; }
        .result h3 { font-family:var(--serif); font-weight:300; color:var(--accent); margin-top:1.5rem; margin-bottom:0.5rem; }
        .result p { margin:0.5rem 0; line-height:1.5; }
        .result ul { margin:0.5rem 0 1rem 1.5rem; }
        .result li { margin-bottom:0.3rem; }
        .result .miniatures { display:flex; gap:4px; margin-bottom:1rem; flex-wrap:wrap; }
        .result .miniatures img { width:40px; aspect-ratio:74/105; object-fit:cover; border-radius:1px; filter:grayscale(100%) contrast(1.05); }

        /* Tisk */
        @media print {
            .panel, .btn-row, .btn, .btn-primary-action, .btn-secondary, .color-strip, .wheel-container, .card-unit img, .card-name, .selected-angle-label, .panel-label, h1 + p { display:none; }
            .result { display:block !important; max-height:none; overflow-y:visible; border:none; background:white; color:black; }
            body { background:white; color:black; }
        }

        @media (max-width:600px) {
            .wheel-container { width:150px; height:150px; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Úhlový generátor <em>Fyzika linky</em></h1>
    <p style="color:var(--dim); margin-bottom:1.5rem;">
        Vyber úhly pro každou kartu a generuj výstup.
    </p>

    <!-- PANEL: Karty s úhloměry -->
    <div class="panel" id="cardsPanel">
        <div class="panel-label">Karty a úhly</div>
        <div class="cards-row" id="cardsRow"></div>
        <div class="color-strip" id="colorStrip"></div>
    </div>

    <!-- PANEL: Generování -->
    <div class="panel">
        <div class="panel-label">Vyber typ výstupu</div>
        <div class="btn-row">
            <button class="btn" onclick="generateOutput('choreography')">Choreografická partitura</button>
            <button class="btn" onclick="generateOutput('game')">Herní koncept</button>
            <button class="btn" onclick="generateOutput('installation')">Instalační plán</button>
            <button class="btn" onclick="generateOutput('lecture')">Performativní přednáška</button>
            <button class="btn" onclick="generateOutput('screenplay')">Scénář krátkého filmu</button>
        </div>
        <div class="btn-row" style="margin-top:0.8rem;">
            <button class="btn btn-secondary" onclick="exportJSON()">📥 Exportovat JSON</button>
            <button class="btn btn-secondary" onclick="copyLink()">📋 Kopírovat odkaz</button>
            <button class="btn btn-secondary" onclick="shareToGallery()">🔗 Sdílet na přehlídku jevů</button>
            <button class="btn btn-secondary" onclick="goBackToGraphic()">← Zpět na grafický generátor</button>
        </div>
    </div>

    <!-- Výstup -->
    <div id="result" class="result"></div>
</div>

<script>
// ──────────────────────────────────────────────────────────────
// ZDE VLOŽ JSON DATA – celý obsah souboru gen_h_vety.json
// ──────────────────────────────────────────────────────────────
const GEN_DATA = /* ZDE VLOŽ JSON DATA */ [];

// ──────────────────────────────────────────────────────────────
// Definice 12 úhlů (barvy a pořadí podle stupňů 0-330)
// ──────────────────────────────────────────────────────────────
const UHLY_DEF = [
    { id: 'analyticky',  nazev: 'Analytický',  barva: '#ffffff', stupne: 0 },
    { id: 'kulturni',    nazev: 'Kulturní',    barva: '#a8d5a2', stupne: 30 },
    { id: 'filozoficky', nazev: 'Filozofický', barva: '#b3d4ff', stupne: 60 },
    { id: 'naivni',      nazev: 'Naivní',      barva: '#40e0d0', stupne: 90 },
    { id: 'jazykovy',    nazev: 'Jazykový',    barva: '#c8a2c8', stupne: 120 },
    { id: 'metaforicky', nazev: 'Metaforický', barva: '#2e8b57', stupne: 150 },
    { id: 'asociacni',   nazev: 'Asociační',   barva: '#d2b48c', stupne: 180 },
    { id: 'introspektivni', nazev: 'Introspektivní', barva: '#ffd700', stupne: 210 },
    { id: 'ironicky',    nazev: 'Ironický',    barva: '#ffa500', stupne: 240 },
    { id: 'groteskni',   nazev: 'Groteskní',   barva: '#dc143c', stupne: 270 },
    { id: 'absurdni',    nazev: 'Absurdní',    barva: '#c71585', stupne: 300 },
    { id: 'surrealisticky', nazev: 'Surrealistický', barva: '#8b4513', stupne: 330 }
];

// Mapa pro rychlý přístup k definici úhlu podle id
const UHLY_MAP = {};
UHLY_DEF.forEach(u => UHLY_MAP[u.id] = u);

// ──────────────────────────────────────────────────────────────
// Extrakce karet z GEN_DATA
// ──────────────────────────────────────────────────────────────
function extractCardsFromData() {
    const cardMap = new Map();
    GEN_DATA.forEach(item => {
        if (!cardMap.has(item.id)) {
            cardMap.set(item.id, {
                id: item.id,
                name: item.id.charAt(0).toUpperCase() + item.id.slice(1),
                file: item.id + '.jpg',
                landscape: ['had','krokodyl'].includes(item.id)
            });
        }
    });
    return Array.from(cardMap.values());
}
const ALL_CARDS = extractCardsFromData();
const CARDS_MAP = {};
ALL_CARDS.forEach(c => CARDS_MAP[c.id] = c);

const baseUrl = "https://artmisanovak-prog.github.io/dataset_multi_fenomen/doma/ilustrace/";

// ──────────────────────────────────────────────────────────────
// Stav
// ──────────────────────────────────────────────────────────────
let currentCards = [];   // [{ id: 'mys', angleId: null, canvasRef: ... }]
let layoutGridIndex = 0; // pro zpětný odkaz

// ──────────────────────────────────────────────────────────────
// Načtení z URL
// ──────────────────────────────────────────────────────────────
function loadFromHash() {
    const hash = window.location.hash.substring(1);
    if (!hash) return;
    try {
        const state = JSON.parse(atob(hash));
        if (state.c && Array.isArray(state.c)) {
            // state.c = pole ID karet
            currentCards = state.c.map(cardId => ({
                id: cardId,
                angleId: null
            }));
        }
        if (state.u && Array.isArray(state.u) && state.u.length === currentCards.length) {
            currentCards.forEach((card, i) => {
                card.angleId = state.u[i] || null;
            });
        }
        if (state.g !== undefined) {
            layoutGridIndex = state.g;
        }
    } catch(e) {
        // neplatný hash
    }
}

// ──────────────────────────────────────────────────────────────
// Vykreslení karet s úhloměry
// ──────────────────────────────────────────────────────────────
function renderCards() {
    const row = document.getElementById('cardsRow');
    row.innerHTML = '';
    if (currentCards.length === 0) {
        row.innerHTML = '<p style="color:var(--dim);">Žádné karty nebyly vybrány. Vraťte se do grafického generátoru nebo vložte URL s kartami.</p>';
        updateColorStrip();
        return;
    }

    currentCards.forEach((card, index) => {
        const cardInfo = CARDS_MAP[card.id];
        if (!cardInfo) return;

        const unit = document.createElement('div');
        unit.className = 'card-unit';

        const img = document.createElement('img');
        img.src = `${baseUrl}${cardInfo.file}`;
        img.alt = cardInfo.name;
        if (cardInfo.landscape) img.classList.add('landscape');
        img.onerror = () => { img.src = `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="74" height="105"><rect fill="%23333" width="74" height="105"/><text x="50%" y="50%" fill="%23888" text-anchor="middle" dy=".3em" font-size="8">${cardInfo.name}</text></svg>`; };

        const nameSpan = document.createElement('span');
        nameSpan.className = 'card-name';
        nameSpan.textContent = cardInfo.name;

        const wheelDiv = document.createElement('div');
        wheelDiv.className = 'wheel-container';
        const canvas = document.createElement('canvas');
        canvas.width = 200;
        canvas.height = 200;
        canvas.setAttribute('data-card-index', index);
        canvas.addEventListener('click', handleWheelClick);
        canvas.style.outline = 'none';
        canvas.setAttribute('tabindex', '-1');
        wheelDiv.appendChild(canvas);

        const angleLabel = document.createElement('div');
        angleLabel.className = 'selected-angle-label';
        angleLabel.id = `angle-label-${index}`;

        unit.appendChild(img);
        unit.appendChild(nameSpan);
        unit.appendChild(wheelDiv);
        unit.appendChild(angleLabel);

        row.appendChild(unit);

        // Uložíme referenci na canvas pro překreslení
        card.canvasRef = canvas;
        card.labelRef = angleLabel;

        // Vykreslíme kolečko
        drawWheel(canvas, card.angleId);
        updateAngleLabel(card);
    });

    updateColorStrip();
}

function drawWheel(canvas, selectedAngleId) {
    const ctx = canvas.getContext('2d');
    const CX = 100, CY = 100, RMAX = 90, RMIN = 28;
    ctx.clearRect(0,0,200,200);

    const sa = (Math.PI*2)/12;
    UHLY_DEF.forEach((u, i) => {
        const startA = -Math.PI/2 + i*sa + 0.04;
        const endA = startA + sa - 0.08;
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, RMAX, startA, endA);
        ctx.closePath();
        // Zvýraznění
        ctx.fillStyle = (u.id === selectedAngleId) ? u.barva + '60' : u.barva + '20';
        ctx.fill();
        ctx.strokeStyle = 'rgba(168,152,128,.2)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Text v segmentu
        const midA = startA + (sa-0.08)/2;
        const lr = (RMAX+RMIN)/2 + 6;
        const lx = CX + Math.cos(midA)*lr;
        const ly = CY + Math.sin(midA)*lr;
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(midA + Math.PI/2);
        ctx.fillStyle = (u.id === selectedAngleId) ? '#fff' : u.barva;
        ctx.font = '300 6px "DM Mono", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(u.nazev.split(' ')[0], 0, 0);
        ctx.restore();
    });

    // Středové kolečko
    ctx.beginPath();
    ctx.arc(CX, CY, RMIN, 0, Math.PI*2);
    ctx.fillStyle = '#0f0f0f';
    ctx.fill();
    ctx.strokeStyle = 'rgba(168,152,128,.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(168,152,128,.3)';
    ctx.font = '300 8px "DM Mono"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('úhel', CX, CY);
}

function handleWheelClick(e) {
    const canvas = e.target;
    const index = parseInt(canvas.getAttribute('data-card-index'));
    if (isNaN(index) || !currentCards[index]) return;

    const rect = canvas.getBoundingClientRect();
    const scale = 200 / rect.width;  // canvas vnitřní velikost / CSS velikost
    const mx = (e.clientX - rect.left) * scale - 100;
    const my = (e.clientY - rect.top) * scale - 100;
    const dist = Math.sqrt(mx*mx + my*my);
    if (dist < 28 || dist > 90) return; // mimo prstenec

    let angle = Math.atan2(my, mx) + Math.PI/2;
    if (angle < 0) angle += Math.PI*2;
    const idx = Math.floor(angle / (Math.PI*2/12));
    if (UHLY_DEF[idx]) {
        currentCards[index].angleId = UHLY_DEF[idx].id;
        drawWheel(canvas, currentCards[index].angleId);
        updateAngleLabel(currentCards[index]);
        updateColorStrip();
        updateHash();
    }
}

function updateAngleLabel(card) {
    if (!card.labelRef) return;
    if (card.angleId && UHLY_MAP[card.angleId]) {
        card.labelRef.textContent = UHLY_MAP[card.angleId].nazev;
    } else {
        card.labelRef.textContent = 'klikni na kruh';
    }
}

// ──────────────────────────────────────────────────────────────
// Barevný proužek
// ──────────────────────────────────────────────────────────────
function updateColorStrip() {
    const strip = document.getElementById('colorStrip');
    strip.innerHTML = '';
    currentCards.forEach(card => {
        const seg = document.createElement('div');
        seg.className = 'segment';
        if (card.angleId && UHLY_MAP[card.angleId]) {
            seg.style.backgroundColor = UHLY_MAP[card.angleId].barva;
        } else {
            seg.style.backgroundColor = '#333';
        }
        strip.appendChild(seg);
    });
}

// ──────────────────────────────────────────────────────────────
// URL hash
// ──────────────────────────────────────────────────────────────
function updateHash() {
    const state = {
        c: currentCards.map(c => c.id),
        u: currentCards.map(c => c.angleId || null),
        g: layoutGridIndex
    };
    window.location.hash = btoa(JSON.stringify(state));
}

function copyLink() {
    updateHash();
    navigator.clipboard.writeText(window.location.href).then(() => alert('✅ Odkaz zkopírován')).catch(() => prompt('Zkopíruj si odkaz:', window.location.href));
}

function shareToGallery() {
    updateHash();
    navigator.clipboard.writeText(window.location.href).then(() => alert('✅ Odkaz pro přehlídku jevů zkopírován')).catch(() => prompt('Zkopíruj si odkaz:', window.location.href));
}

function goBackToGraphic() {
    const state = {
        c: currentCards.map(c => c.id),
        g: layoutGridIndex
    };
    window.location.href = 'graficky.html#' + btoa(JSON.stringify(state));
}

// ──────────────────────────────────────────────────────────────
// Generování výstupů
// ──────────────────────────────────────────────────────────────
function findAngleData(cardId, angleId) {
    return GEN_DATA.find(item => item.id === cardId && item.uhel === angleId);
}

function generateOutput(mode) {
    const resultDiv = document.getElementById('result');
    if (currentCards.length === 0) {
        resultDiv.innerHTML = '<p>Nejsou vybrány žádné karty.</p>';
        resultDiv.style.display = 'block';
        return;
    }

    // Sestavíme data pro výstup
    const items = [];
    currentCards.forEach(card => {
        const cardInfo = CARDS_MAP[card.id];
        const angleData = card.angleId ? findAngleData(card.id, card.angleId) : null;
        items.push({
            cardInfo: cardInfo,
            angleId: card.angleId,
            angleDef: card.angleId ? UHLY_MAP[card.angleId] : null,
            data: angleData
        });
    });

    let html = '';

    switch (mode) {
        case 'choreography':
            html = buildChoreography(items);
            break;
        case 'game':
            html = buildGame(items);
            break;
        case 'installation':
            html = buildInstallation(items);
            break;
        case 'lecture':
            html = buildLecture(items);
            break;
        case 'screenplay':
            html = buildScreenplay(items);
            break;
        default:
            html = '<p>Neznámý režim.</p>';
    }

    resultDiv.innerHTML = html;
    resultDiv.style.display = 'block';
    resultDiv.scrollIntoView({ behavior: 'smooth' });
}

function miniaturesHTML(items) {
    let html = '<div class="miniatures">';
    items.forEach(item => {
        if (item.cardInfo) {
            html += `<img src="${baseUrl}${item.cardInfo.file}" alt="${item.cardInfo.name}" onerror="this.style.display='none'">`;
        }
    });
    html += '</div>';
    return html;
}

function buildChoreography(items) {
    let html = '<h2>Choreografická partitura</h2>';
    html += miniaturesHTML(items);
    items.forEach((item, i) => {
        const d = item.data;
        html += `<h3>Sólo ${i+1}: ${item.cardInfo?.name || '?'} – ${item.angleDef?.nazev || '?'}</h3>`;
        if (d) {
            html += `<p><strong>Tělo:</strong> ${d.kvalita_tela || '—'}</p>`;
            html += `<p><strong>Pohyb:</strong> ${d.pohyb || '—'}</p>`;
            html += `<p><strong>Zvuk:</strong> ${d.zvuk || '—'}</p>`;
            html += `<p><strong>Intenzita:</strong> ${d.intenzita || '—'}</p>`;
        } else {
            html += '<p><em>Úhel není vybrán.</em></p>';
        }
        if (i < items.length - 1) {
            html += `<p><em>→ přechod: ${items[i+1].cardInfo?.name || '?'} vstupuje</em></p>`;
        }
    });
    return html;
}

function buildGame(items) {
    let html = '<h2>Herní koncept</h2>';
    html += miniaturesHTML(items);
    const first = items[0]?.data;
    const last = items[items.length-1]?.data;
    const titleWords = (first?.pole?.[0] || '') + ' ' + (last?.pole?.[0] || '');
    html += `<h3>Název hry: ${titleWords.trim() || 'Bezejmenná'}</h3>`;
    html += '<h3>Postavy</h3><ul>';
    items.forEach(item => {
        html += `<li><strong>${item.cardInfo?.name || '?'}</strong> – <em>${item.data?.typ || '?'}</em>: ${item.data?.funkce || '?'}</li>`;
    });
    html += '</ul><h3>Struktura úrovní</h3><p>';
    items.forEach((item, i) => {
        html += `Úroveň ${i+1}: ${item.data?.pohyb || '?'}. `;
    });
    html += '</p>';
    return html;
}

function buildInstallation(items) {
    let html = '<h2>Instalační plán</h2>';
    html += miniaturesHTML(items);
    html += '<p><strong>Prostor:</strong> Mřížka s kartami rozmístěnými podle pozic.</p><ul>';
    items.forEach((item, i) => {
        html += `<li><strong>Zóna ${i+1} (${item.cardInfo?.name || '?'}):</strong> ${item.data?.kvalita_tela || '?'}. Zvuk: ${item.data?.zvuk || '?'}</li>`;
    });
    html += '</ul>';
    return html;
}

function buildLecture(items) {
    let html = '<h2>Performativní přednáška</h2>';
    html += miniaturesHTML(items);
    html += '<p><strong>Téma:</strong> (zadejte vědecký koncept)</p>';
    items.forEach((item, i) => {
        html += `<p><strong>Část ${i+1}:</strong> Představte si ${item.data?.pole?.[0] || 'neznámé'} jako ${item.cardInfo?.name || '?'} – ${item.data?.funkce || '?'}. <em>"${item.data?.nazev || ''}"</em></p>`;
    });
    return html;
}

function buildScreenplay(items) {
    let html = '<h2>Scénář krátkého filmu</h2>';
    html += miniaturesHTML(items);
    html += '<h3>Logline</h3><p>' + items.map(s => s.data?.funkce).join(' ') + '</p>';
    html += '<h3>Postavy</h3><ul>';
    items.forEach(s => {
        html += `<li><strong>${s.cardInfo?.name || '?'}:</strong> ${s.data?.typ || '?'}. ${s.data?.kvalita_tela || '?'}</li>`;
    });
    html += '</ul><h3>Scénosled</h3>';
    items.forEach((s, i) => {
        html += `<p><strong>Scéna ${i+1}:</strong> ${s.data?.pohyb || '?'}. Zvuk: ${s.data?.zvuk || '?'}. Dialog: "${s.data?.nazev || ''}".</p>`;
    });
    return html;
}

// ──────────────────────────────────────────────────────────────
// Export JSON
// ──────────────────────────────────────────────────────────────
function exportJSON() {
    const output = currentCards.map(card => {
        const angleData = card.angleId ? findAngleData(card.id, card.angleId) : null;
        return {
            cardId: card.id,
            angleId: card.angleId,
            angleName: card.angleId ? UHLY_MAP[card.angleId]?.nazev : null,
            data: angleData
        };
    });
    const blob = new Blob([JSON.stringify(output, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fyzika_linky_vystup.json';
    a.click();
    URL.revokeObjectURL(url);
}
