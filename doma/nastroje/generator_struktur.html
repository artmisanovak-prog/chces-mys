<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Chceš myš? · Kompoziční generátor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1815; color: #e8e0d0; font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 1rem;
    }
    .app { width: 100%; max-width: 900px; }
    h1 { font-weight: 300; letter-spacing: -0.02em; margin-bottom: 0.5rem; color: #d4c8b0; }
    .subtitle { font-size: 0.8rem; color: #a89880; margin-bottom: 1.5rem; }

    /* Panely */
    .panel {
      background: #25221e; border: 1px solid #3a3228; border-radius: 6px; padding: 1rem; margin-bottom: 1rem;
    }
    .panel-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #8b7a62; margin-bottom: 0.8rem; }

    /* Karty k výběru */
    .card-pool { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .card-pool img { width: 60px; height: 84px; object-fit: cover; border-radius: 3px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .card-pool img.selected { border-color: #c0aa90; opacity: 0.7; }

    /* Plátno */
    .canvas { display: flex; flex-wrap: wrap; gap: 1rem; min-height: 150px; border: 1px dashed #3a3228; padding: 1rem; border-radius: 4px; align-items: center; justify-content: center; }
    .canvas img { width: 80px; height: 112px; object-fit: cover; border-radius: 4px; cursor: grab; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .canvas img:active { cursor: grabbing; }
    .drop-zone { width: 80px; height: 112px; border: 2px dashed #5a5248; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #5a5248; font-size: 0.7rem; }

    /* Tlačítka */
    .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.8rem 0; }
    .btn {
      background: #2a241e; border: 1px solid #5a5248; color: #c0aa90; padding: 0.4rem 1rem;
      font-size: 0.75rem; border-radius: 4px; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: #3a3228; border-color: #a89880; }
    .btn.primary { background: #4a4030; border-color: #a89880; color: #f0e8d8; }

    /* Generovaný text */
    .output-box {
      background: #0f0d0a; border: 1px solid #3a3228; padding: 1rem; margin-top: 1rem; font-size: 1rem; line-height: 1.6;
      white-space: pre-wrap; color: #d4c8b0; min-height: 60px; border-radius: 4px;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>🎴 Kompoziční generátor</h1>
  <div class="subtitle">Vylosuj, přetáhni na plátno, vygeneruj strukturu.</div>

  <!-- Panel 1: Výběr karet -->
  <div class="panel">
    <div class="panel-title">1. Vyber karty (klikej)</div>
    <div class="card-pool" id="cardPool"></div>
    <div class="btn-row">
      <button class="btn" onclick="randomSelect(3)">🎲 Vylosovat 3</button>
      <button class="btn" onclick="randomSelect(6)">🎲 Vylosovat 6</button>
      <button class="btn" onclick="randomSelect(9)">🎲 Vylosovat 9</button>
      <button class="btn" onclick="clearSelection()">🗑 Zrušit výběr</button>
    </div>
  </div>

  <!-- Panel 2: Plátno -->
  <div class="panel">
    <div class="panel-title">2. Přetáhni karty na plátno (můžeš je řadit)</div>
    <div class="canvas" id="canvas" ondragover="event.preventDefault()" ondrop="dropToCanvas(event)"></div>
    <div class="btn-row" style="margin-top:0.8rem;">
      <button class="btn" onclick="clearCanvas()">🧹 Vyčistit plátno</button>
      <button class="btn" id="sortBtn" onclick="sortCanvas()">↔ Seřadit zleva</button>
    </div>
  </div>

  <!-- Panel 3: Generování -->
  <div class="panel">
    <div class="panel-title">3. Generuj strukturu</div>
    <button class="btn primary" onclick="generateStructure()">✨ Generovat</button>
    <button class="btn" onclick="shareComposition()">🔗 Kopírovat odkaz</button>
    <div class="output-box" id="outputBox">Zde se objeví vygenerovaná struktura...</div>
  </div>
</div>

<script>
  // --- KONFIGURACE ---
  // Používáme tvé existující URL. Každá karta má ID, jméno a URL na HTML pohádky.
  const CARD_REGISTRY = [
    { id: 'mys',      name: 'Myš',       url: 'https://artmisanovak-prog.github.io/chces-mys/doma/data/uhly/mys_uhly.html',      img: 'https://artmisanovak-prog.github.io/chces-mys/doma/ilustrace/mys.jpg' },
    { id: 'kocour',   name: 'Kocour',    url: 'https://artmisanovak-prog.github.io/chces-mys/doma/data/uhly/kocour_uhly.html',   img: 'https://artmisanovak-prog.github.io/chces-mys/doma/ilustrace/kocour.jpg' },
    { id: 'ryba',     name: 'Ryba',      url: 'https://artmisanovak-prog.github.io/chces-mys/doma/data/uhly/ryba_uhly.html',     img: 'https://artmisanovak-prog.github.io/chces-mys/doma/ilustrace/ryba.jpg' },
    { id: 'zajic',    name: 'Zajíc',     url: 'https://artmisanovak-prog.github.io/chces-mys/doma/data/uhly/zajic_uhly.html',    img: 'https://artmisanovak-prog.github.io/chces-mys/doma/ilustrace/zajic.jpg' },
    { id: 'pav',      name: 'Páv',       url: 'https://artmisanovak-prog.github.io/chces-mys/doma/data/uhly/pav_uhly.html',      img: 'https://artmisanovak-prog.github.io/chces-mys/doma/ilustrace/pav.jpg' },
    { id: 'motyl',    name: 'Motýl',     url: 'https://artmisanovak-prog.github.io/chces-mys/doma/data/uhly/motyl_uhly.html',    img: 'https://artmisanovak-prog.github.io/chces-mys/doma/ilustrace/motyl.jpg' },
    { id: 'netopyr',  name: 'Netopýr',   url: 'https://artmisanovak-prog.github.io/chces-mys/doma/data/uhly/netopyr_uhly.html',  img: 'https://artmisanovak-prog.github.io/chces-mys/doma/ilustrace/netopyr.jpg' },
    { id: 'krokodyl', name: 'Krokodýl',  url: 'https://artmisanovak-prog.github.io/chces-mys/doma/data/uhly/krokodyl_uhly.html', img: 'https://artmisanovak-prog.github.io/chces-mys/doma/ilustrace/krokodyl.jpg' },
    { id: 'pavouk',   name: 'Pavouk',    url: 'https://artmisanovak-prog.github.io/chces-mys/doma/data/uhly/pavouk_uhly.html',   img: 'https://artmisanovak-prog.github.io/chces-mys/doma/ilustrace/pavouk.jpg' }
  ];

  let selectedCards = []; // ID vybraných karet
  let canvasCards = [];   // ID karet na plátně (v pořadí)

  // --- RENDER ---
  function renderPool() {
    const pool = document.getElementById('cardPool');
    pool.innerHTML = '';
    CARD_REGISTRY.forEach(card => {
      const img = document.createElement('img');
      img.src = card.img;
      img.alt = card.name;
      img.dataset.id = card.id;
      if (selectedCards.includes(card.id)) img.classList.add('selected');
      img.addEventListener('click', () => toggleCardSelection(card.id));
      pool.appendChild(img);
    });
  }

  function toggleCardSelection(id) {
    if (selectedCards.includes(id)) {
      selectedCards = selectedCards.filter(c => c !== id);
    } else {
      if (selectedCards.length >= 9) return; // max 9
      selectedCards.push(id);
    }
    renderPool();
  }

  function randomSelect(count) {
    const shuffled = [...CARD_REGISTRY].sort(() => Math.random() - 0.5);
    selectedCards = shuffled.slice(0, count).map(c => c.id);
    renderPool();
  }

  function clearSelection() {
    selectedCards = [];
    renderPool();
  }

  // --- PLÁTNO ---
  function renderCanvas() {
    const canvas = document.getElementById('canvas');
    canvas.innerHTML = '';
    canvasCards.forEach((id, index) => {
      const card = CARD_REGISTRY.find(c => c.id === id);
      if (!card) return;
      const img = document.createElement('img');
      img.src = card.img;
      img.alt = card.name;
      img.draggable = true;
      img.dataset.index = index;
      img.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', index.toString());
        e.target.style.opacity = '0.5';
      });
      img.addEventListener('dragend', e => { e.target.style.opacity = '1'; });
      canvas.appendChild(img);
    });
    // Přidáme drop zónu na konec
    const dz = document.createElement('div');
    dz.className = 'drop-zone';
    dz.textContent = '+';
    dz.addEventListener('dragover', e => e.preventDefault());
    dz.addEventListener('drop', e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      // Z panelu výběru (přetahujeme přímo z obrázků?)
      // Pro jednoduchost: drop zóna přidá poslední nevybranou kartu?
    });
    canvas.appendChild(dz);
  }

  function dropToCanvas(e) {
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    // Pokud přetahujeme z card pool (musíme to nastavit)
    if (id && CARD_REGISTRY.some(c => c.id === id)) {
      if (canvasCards.length >= 9) return;
      canvasCards.push(id);
      renderCanvas();
    }
  }

  // Pro zjednodušení budeme přidávat vybrané karty tlačítkem
  function addSelectedToCanvas() {
    selectedCards.forEach(id => {
      if (!canvasCards.includes(id) && canvasCards.length < 9) {
        canvasCards.push(id);
      }
    });
    renderCanvas();
  }

  function clearCanvas() {
    canvasCards = [];
    renderCanvas();
  }

  function sortCanvas() {
    // Seřadí karty podle pořadí v selectedCards (nebo abecedně)
    canvasCards.sort((a, b) => {
      const idxA = selectedCards.indexOf(a);
      const idxB = selectedCards.indexOf(b);
      return idxA - idxB;
    });
    renderCanvas();
  }

  // --- GENEROVÁNÍ ---
  function generateStructure() {
    if (canvasCards.length === 0) {
      document.getElementById('outputBox').textContent = 'Nejprve přidej karty na plátno.';
      return;
    }
    const names = canvasCards.map(id => CARD_REGISTRY.find(c => c.id === id)?.name || id);
    
    // Jednoduchý poetický generátor založený na pořadí
    const templates = [
      `${names[0]} potkává ${names[1] || 'stín'} a společně hledají ${names[2] || 'ztracený klíč'}.`,
      `V laboratoři ${names[0]} objevuje, že ${names[1] || 'nic'} se skrývá za ${names[2] || 'oknem'}.`,
      `${names[0]} učí ${names[1] || 'motýla'} tančit ${names[2] || 'soumrakem'}.`,
      `Spojením ${names[0]} a ${names[1] || 'pavouka'} vzniká nový druh ${names[2] || 'ticha'}.`,
      `${names[0]} vzpomíná na ${names[1] || 'déšť'}, zatímco ${names[2] || 'vítr'} odnáší ${names[3] || 'listy'}.`
    ];
    
    const seed = canvasCards.length * 13 + names.join('').length;
    const templateIndex = seed % templates.length;
    let output = templates[templateIndex];

    // Přidání dalších karet jako rozšíření
    if (names.length > 3) {
      output += ` Do toho vstupuje ${names.slice(3).join(', ')}.`;
    }
    
    document.getElementById('outputBox').textContent = output;
  }

  function shareComposition() {
    const params = new URLSearchParams();
    params.set('cards', canvasCards.join(','));
    const url = window.location.origin + window.location.pathname + '?' + params.toString();
    navigator.clipboard?.writeText(url)
      .then(() => alert('Odkaz zkopírován: ' + url))
      .catch(() => alert('Odkaz: ' + url));
  }

  // --- INICIALIZACE ---
  function init() {
    renderPool();
    renderCanvas();
    // Zpracování URL parametrů
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('cards')) {
      const ids = urlParams.get('cards').split(',').filter(id => CARD_REGISTRY.some(c => c.id === id));
      canvasCards = ids;
      renderCanvas();
    }
    // Pro jednoduchost přidáme tlačítko pro přesun vybraných karet na plátno
    const moveBtn = document.createElement('button');
    moveBtn.className = 'btn';
    moveBtn.textContent = '⬇ Přesunout vybrané na plátno';
    moveBtn.addEventListener('click', addSelectedToCanvas);
    document.querySelector('#cardPool').parentNode.insertBefore(moveBtn, document.querySelector('#cardPool').nextSibling);
  }
  init();
</script>
</body>
</html>
